<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saran & Masukan - NetAdmin Hub</title>
    <link rel="stylesheet" href="gaya.css">
</head>
<body>
    <div class="container" style="max-width: 450px; text-align: left; margin: 30px auto;">
        <h1>📥 Kotak Saran</h1>
        <p>Kirimkan kritik, masukan, atau ide fitur baru untuk NetAdmin Hub.</p>
        
        <form onsubmit="event.preventDefault(); alert('Terima kasih! Saran kamu berhasil dikirim.'); window.location.href='index.html';">
            <label style="font-size: 14px;">Nama:</label><br>
            <input type="text" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 5px;"><br>
            
            <label style="font-size: 14px;">Pesan / Masukan:</label><br>
            <textarea required style="width: 100%; height: 80px; padding: 8px; margin: 5px 0 15px 0; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 5px;"></textarea><br>
            
            <button type="submit" style="background: #00ff88; color: #000; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%;">Kirim Saran</button>
        </form>
        
        <br>
        <a href="index.html" style="color: #00ff88; font-weight: bold; text-decoration: none;">← Kembali ke Dashboard</a>
    </div>
</body>
</html>
