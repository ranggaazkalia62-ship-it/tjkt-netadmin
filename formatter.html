<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config Formatter - NetAdmin Hub</title>
    <link rel="stylesheet" href="gaya.css">
</head>
<body>
    <div class="container" style="max-width: 480px; text-align: left; margin: 30px auto;">
        <h1>🛠️ Config Formatter</h1>
        <p>Bersihkan baris kosong otomatis pada teks konfigurasi atau JSON.</p>
        
        <textarea id="inputText" placeholder="Tempel teks atau konfigurasi di sini..." style="width: 100%; height: 100px; background: rgba(0,0,0,0.3); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; padding: 10px; margin-bottom: 10px;"></textarea>
        
        <button onclick="formatTeks()" style="background: #00ff88; color: #000; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%;">Bersihkan Teks</button>
        
        <p id="outputText" style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 5px; font-family: monospace; font-size: 13px; margin-top: 10px; white-space: pre-wrap;"></p>
        
        <br>
        <a href="index.html" style="color: #00ff88; font-weight: bold; text-decoration: none;">← Kembali ke Dashboard</a>
    </div>

    <script>
        function formatTeks() {
            let text = document.getElementById('inputText').value;
            let cleaned = text.split('\n').filter(line => line.trim() !== '').join('\n');
            document.getElementById('outputText').innerText = cleaned || "Tidak ada teks untuk dibersihkan.";
        }
    </script>
</body>
</html>
